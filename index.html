  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to bottom,
        rgba(20, 6, 10, 0.72) 0%,
        rgba(20, 6, 10, 0.25) 22%,
        rgba(20, 6, 10, 0.05) 45%,
        rgba(20, 6, 10, 0.25) 65%,
        rgba(20, 6, 10, 0.88) 100%);

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    padding: clamp(1.5rem, 4vh, 3rem) 1.25rem;
  }

  header h1 {
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: normal;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--cream);
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
  }

  header .rule {
    width: clamp(70px, 12vw, 130px);
    height: 1px;
    margin: 0.9rem auto 0;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
  }

  footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
    padding-bottom: env(safe-area-inset-bottom);
  }

  .coming {
    font-size: clamp(1.6rem, 4.5vw, 2.8rem);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--cream);
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.7);
    animation: glow 3.2s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; text-shadow: 0 2px 22px rgba(212, 175, 122, 0.55); }
  }

  .kneel {
    font-size: clamp(1rem, 2.4vw, 1.25rem);
    font-style: italic;
    color: rgba(245, 237, 230, 0.9);
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
  }

  .spoil {
    display: inline-block;
    margin-top: 0.2rem;
    padding: 0.8rem 2.4rem;
    font-family: inherit;
    font-size: clamp(1rem, 2.4vw, 1.2rem);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-decoration: none;
    color: #fff;
    background: linear-gradient(135deg, var(--red), var(--red-soft));
    border: 1px solid rgba(212, 175, 122, 0.7);
    border-radius: 999px;
    box-shadow: 0 4px 24px rgba(200, 16, 46, 0.5);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .spoil:hover,
  .spoil:focus-visible {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 8px 32px rgba(200, 16, 46, 0.75);
  }

  /* Portrait phones: keep the subject visible */
  @media (max-width: 600px) and (orientation: portrait) {
    .bg { background-position: 62% 18%; }
  }
